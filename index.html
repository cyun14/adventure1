<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 24px;
      min-height: 100vh;
      padding: 16px;
      background: #f4f4f4;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 32px);
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="pig.jpeg" alt="Pig">
  <img src="friend.jpg" alt="Friend">
</body>
</html>
